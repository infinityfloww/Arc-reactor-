<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STARK CORE V5</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.150.0/three.min.js"></script>

    <style>
        :root { --cyan: #00f2ff; --glass: rgba(10, 25, 45, 0.9); }
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: var(--cyan); }
        
        #start-screen { 
            position: fixed; inset: 0; background: #000; z-index: 1000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        
        .box { padding: 30px; border: 1px solid var(--cyan); text-align: center; background: rgba(0,242,255,0.05); }
        
        button { 
            background: transparent; border: 2px solid var(--cyan); color: var(--cyan); 
            padding: 15px 25px; cursor: pointer; font-weight: bold; margin-top: 20px;
        }

        #ui { position: absolute; inset: 0; pointer-events: none; display: none; }
        .panel { position: absolute; top: 20px; padding: 15px; background: var(--glass); border: 1px solid var(--cyan); pointer-events: all; }
        #left { left: 20px; } #right { right: 20px; text-align: right; }
        
        video { position: absolute; bottom: 20px; right: 20px; width: 150px; border: 1px solid var(--cyan); transform: scaleX(-1); }
        #msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; color: red; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="box">
            <h1>STARK SYSTEM</h1>
            <p id="load-status">SYSTEM CHECK: WAITING FOR LIBRARIES...</p>
            <button id="main-btn" style="display:none;" onclick="boot()">INITIALIZE REACTOR</button>
        </div>
    </div>

    <div id="ui">
        <div id="left" class="panel">
            <h3>MODELS</h3>
            <button onclick="setM('reactor')">ARC MK1</button>
            <button onclick="setM('nano')">NANO</button>
        </div>
        <div id="right" class="panel">
            <h3>STATUS</h3>
            <p>TRACKING: <span id="stat">OFFLINE</span></p>
        </div>
        <div id="msg">OVERLOAD</div>
        <video id="v" autoplay playsinline></video>
    </div>

    <script>
        // Check if libraries are loaded
        const checkInterval = setInterval(() => {
            if (window.Hands && window.Camera && window.THREE) {
                document.getElementById('load-status').innerText = "SYSTEM READY";
                document.getElementById('main-btn').style.display = "block";
                clearInterval(checkInterval);
            }
        }, 500);

        let s, c, r, g, blast = false, mode = 'reactor';
        
        function boot() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            
            s = new THREE.Scene();
            c = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            r = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            r.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(r.domElement);
            g = new THREE.Group(); s.add(g); c.position.z = 10;
            
            const l = new THREE.PointLight(0xffffff, 1); l.position.set(0,0,10); s.add(l);
            build(); loop();

            const v = document.getElementById('v');
            const h = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
            h.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.7 });

            h.onResults((res) => {
                const st = document.getElementById('stat');
                if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
                    st.innerText = "LOCKED"; st.style.color = "#00ff00";
                    const lm = res.multiHandLandmarks[0];
                    const d = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y) * 25;
                    
                    if(d > 14 && !blast) {
                        blast = true; document.getElementById('msg').style.display = 'block';
                        setTimeout(() => { blast = false; document.getElementById('msg').style.display='none'; build(); }, 2000);
                    } else if(!blast) {
                        g.children.forEach((obj, i) => {
                            obj.scale.setScalar(1 + d * 0.1);
                            obj.position.z = Math.sin(Date.now()*0.005 + i) * d;
                        });
                    }
                    g.rotation.y = (lm[0].x - 0.5) * 4;
                } else { st.innerText = "SEARCHING"; st.style.color = "orange"; }
            });

            const cam = new Camera(v, { onFrame: async () => { await h.send({image: v}); }, width: 640, height: 480 });
            cam.start();
        }

        function build() {
            while(g.children.length > 0) g.remove(g.children[0]);
            const m = new THREE.MeshPhongMaterial({ color: 0x00f2ff, wireframe: true, transparent: true, opacity: 0.6 });
            if(mode === 'reactor') {
                for(let i=0; i<10; i++) {
                    const rng = new THREE.Mesh(new THREE.TorusGeometry(3, 0.05, 8, 40), m);
                    rng.rotation.x = Math.PI/2; rng.position.y = (i-5)*0.4; g.add(rng);
                }
            } else {
                g.add(new THREE.Mesh(new THREE.IcosahedronGeometry(3, 1), m));
            }
        }

        window.setM = (v) => { mode = v; build(); };
        function loop() { requestAnimationFrame(loop); if(g && !blast) g.rotation.y += 0.01; if(r) r.render(s, c); }
    </script>
</body>
</html>
