<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STARK QUANTUM CORE | RESPONSIVE</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">

    <style>
        :root { 
            --cyan: #00f2ff; --red: #ff3333;
            --glass: rgba(0, 10, 20, 0.85);
        }
        
        * { box-sizing: border-box; }

        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Orbitron', sans-serif; color: var(--cyan); 
            height: 100vh; width: 100vw;
        }

        /* HUD positioning fix */
        .hud { position: absolute; z-index: 100; pointer-events: none; text-transform: uppercase; width: 100%; }
        
        #top-nav {
            top: 0; display: flex; align-items: center; justify-content: space-between;
            padding: 10px 20px; background: linear-gradient(to bottom, rgba(0,242,255,0.2), transparent);
            border-bottom: 1px solid rgba(0,242,255,0.1); font-size: 0.8rem;
        }

        .side-panel {
            position: absolute; width: 180px; background: var(--glass);
            border: 1px solid rgba(0,242,255,0.3); padding: 15px;
            pointer-events: all; backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0,0,0,0.5); font-size: 0.7rem;
        }
        
        /* Mobile responsive positions */
        #left-p { top: 70px; left: 10px; border-left: 3px solid var(--cyan); }
        #right-p { top: 70px; right: 10px; border-right: 3px solid var(--cyan); text-align: right; }

        @media (max-width: 600px) {
            .side-panel { width: 140px; padding: 10px; top: 60px; }
            #top-nav { font-size: 0.6rem; padding: 5px 10px; }
        }

        .stark-btn {
            width: 100%; padding: 10px; margin: 5px 0;
            background: rgba(0,242,255,0.05); border: 1px solid var(--cyan);
            color: var(--cyan); font-weight: 900; cursor: pointer;
            transition: 0.3s; font-size: 0.65rem;
        }
        .stark-btn:active { transform: scale(0.95); background: var(--cyan); color: #000; }
        
        .danger-btn { border-color: var(--red); color: var(--red); }

        .scanline {
            width: 100%; height: 2px; background: var(--cyan);
            position: absolute; opacity: 0.1; top: 0;
            animation: scan 4s infinite linear; pointer-events: none;
        }
        @keyframes scan { 100% { top: 100%; } }

        #glitch-overlay {
            position: fixed; inset: 0; background: rgba(255, 0, 0, 0.2);
            display: none; z-index: 200; pointer-events: none;
        }

        .stat-box { margin: 5px 0; opacity: 0.8; }
        .val { color: #fff; font-weight: bold; display: block; }
    </style>
</head>
<body>

    <div id="glitch-overlay"></div>
    <div class="scanline"></div>

    <div id="top-nav" class="hud">
        <div style="font-weight: 900;">CORE MK-LXXXV</div>
        <div id="timer">00:00:00</div>
    </div>

    <div id="left-p" class="side-panel">
        <h4 style="margin:0 0 10px 0">SYSTEMS</h4>
        <button class="stark-btn" onclick="updateMode('arc')">ARC MK-1</button>
        <button class="stark-btn" onclick="updateMode('nano')">NANO TECH</button>
        <button class="stark-btn" onclick="updateMode('infinity')">INFINITY</button>
        
        <div style="margin-top:10px;">
            <label style="font-size: 8px;">FLOW</label>
            <input type="range" style="width:100%" min="0.5" max="2" step="0.1" oninput="setPower(this.value)">
        </div>
    </div>

    <div id="right-p" class="side-panel">
        <h4 style="margin:0 0 10px 0">DIAGS</h4>
        <div class="stat-box">TEMP: <span class="val" id="t-val">2400 K</span></div>
        <div class="stat-box">STAB: <span class="val" id="s-val" style="color:lawngreen">LOCKED</span></div>
        
        <button class="stark-btn" style="margin-top:10px" onclick="nextColor()">SYNC</button>
        <button class="stark-btn danger-btn" onclick="quantumBlast()">BLAST</button>
    </div>

    <script>
        let scene, camera, renderer, controls, group, particles, pCount = 2000;
        let mode = 'arc', themeIdx = 0, isBlasting = false;
        const colors = [0x00f2ff, 0xffcc00, 0xff3333, 0x00ff88, 0x9900ff];

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;

            group = new THREE.Group();
            scene.add(group);

            const pLight = new THREE.PointLight(0xffffff, 2);
            pLight.position.set(5, 5, 10);
            scene.add(pLight);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            initParticles();
            buildCore();
            animate();
        }

        function initParticles() {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(pCount * 3);
            for(let i=0; i<pCount*3; i++) pos[i] = (Math.random()-0.5) * 30;
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({ color: colors[themeIdx], size: 0.05, transparent: true, opacity: 0.6 });
            particles = new THREE.Points(geo, mat);
            scene.add(particles);
        }

        function buildCore() {
            while(group.children.length > 0) group.remove(group.children[0]);
            const mat = new THREE.MeshPhongMaterial({
                color: colors[themeIdx], wireframe: true, transparent: true,
                opacity: 0.6, emissive: colors[themeIdx], emissiveIntensity: 1
            });

            if(mode === 'arc') {
                for(let i=0; i<10; i++) {
                    const r = new THREE.Mesh(new THREE.TorusGeometry(3, 0.05, 12, 40), mat);
                    r.rotation.x = Math.PI/2; r.position.y = (i-5)*0.4;
                    group.add(r);
                }
            } else if(mode === 'nano') {
                group.add(new THREE.Mesh(new THREE.OctahedronGeometry(3, 1), mat));
                group.add(new THREE.Mesh(new THREE.IcosahedronGeometry(4, 1), mat));
            } else {
                for(let i=0; i<30; i++) {
                    const r = new THREE.Mesh(new THREE.TorusGeometry(i*0.1, 0.02, 4, 32), mat);
                    r.rotation.x = Math.PI/2; group.add(r);
                }
            }
        }

        function quantumBlast() {
            if(isBlasting) return;
            isBlasting = true;
            if(navigator.vibrate) navigator.vibrate([100, 300]);

            document.getElementById('glitch-overlay').style.display = 'block';
            document.getElementById('s-val').innerText = 'CRITICAL';
            document.getElementById('s-val').style.color = 'red';

            group.children.forEach(c => {
                c.position.set((Math.random()-0.5)*50, (Math.random()-0.5)*50, (Math.random()-0.5)*50);
                c.scale.setScalar(0.1);
            });

            const positions = particles.geometry.attributes.position.array;
            for(let i=0; i<pCount*3; i++) { positions[i] *= 4; }
            particles.geometry.attributes.position.needsUpdate = true;

            setTimeout(() => {
                isBlasting = false;
                document.getElementById('glitch-overlay').style.display = 'none';
                document.getElementById('s-val').innerText = 'LOCKED';
                document.getElementById('s-val').style.color = 'lawngreen';
                for(let i=0; i<pCount*3; i++) { positions[i] = (Math.random()-0.5) * 30; }
                particles.geometry.attributes.position.needsUpdate = true;
                buildCore();
            }, 1500);
        }

        function updateMode(m) { mode = m; buildCore(); }
        function setPower(v) { 
            group.scale.setScalar(v); 
            document.getElementById('t-val').innerText = Math.floor(2400 * v) + " K";
        }
        function nextColor() {
            themeIdx = (themeIdx + 1) % colors.length;
            particles.material.color.setHex(colors[themeIdx]);
            buildCore();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if(!isBlasting) {
                group.rotation.y += 0.005;
            }
            renderer.render(scene, camera);
        }

        setInterval(() => {
            document.getElementById('timer').innerText = new Date().toLocaleTimeString();
        }, 1000);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
